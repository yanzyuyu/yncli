name: Bug report
description: Create a report to help us improve YNCLI
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug in YNCLI!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YNCLI Version & OS
      placeholder: "e.g. YNCLI v1.2.3 on Windows 11 / Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Error Logs
      description: Paste any terminal logs or stack traces here.
      render: shell
