[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yncli"
version = "1.2.3"
description = "Autonomous Polyglot AI Coding Agent & TUI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "requests>=2.31.0",
    "pygments>=2.17.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
yncli = "yncli.main:main"
